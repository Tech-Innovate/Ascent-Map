[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ascent-map"
version = "0.2.0"
description = "Local-first evidence and decision-support engine for Ascent Map"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "PyYAML>=6.0,<7",
  "pytz>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ascent-map = "ascent_map.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
